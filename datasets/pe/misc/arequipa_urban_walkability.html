    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-71.54494891767754, -16.392455306912865],
      zoom: 12,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.fitBounds([[-71.62407074141568, -16.477158621687355], [-71.46582709393941, -16.30775199213837]], { padding: 30, duration: 0 });

    map.on('load', () => {
      const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol');
      const beforeId = firstSymbol ? firstSymbol.id : undefined;

      // 1. ADD H3 HEXAGON CHOROPLETH LAYER
      map.addSource('h3-walk', { type: 'geojson', data: geojsonH3 });

      map.addLayer({
        id: 'h3-fill',
        type: 'fill',
        source: 'h3-walk',
        paint: {
          'fill-color': [
            'interpolate', ['linear'], ['get', 'walk_mins_capped'],
            0, '#ffffe5',
            5, '#f7fcb9',
            10, '#addd8e',
            15, '#41ab5d',
            22, '#d73027',
            30, '#7f0000'
          ],
          'fill-opacity': 0.60
        }
      }, beforeId);

      map.addLayer({
        id: 'h3-line',
        type: 'line',
        source: 'h3-walk',
        paint: {
          'line-color': '#555555',
          'line-width': 0.3,
          'line-opacity': 0.4
        }
      }, beforeId);

      // 2. ADD SUPERMARKET POIs LAYER
      map.addSource('supermarkets', { type: 'geojson', data: geojsonPOIs });

      map.addLayer({
        id: 'poi-circle',
        type: 'circle',
        source: 'supermarkets',
        paint: {
          'circle-radius': 6,
          'circle-color': '#2563eb',
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffffff'
        }
      });

      // 3. INTERACTIVE POPUPS FOR H3 CELLS
      map.on('click', 'h3-fill', (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(
            `<div class="popup">
               <strong>Walkability Metrics</strong><br/>
               Walk Time: <b>${Number(p.walk_minutes).toFixed(1)} mins</b><br/>
               Est. Network Dist: ${Number(p.est_network_dist_m).toFixed(0)} meters<br/>
               <span style="color:#777">H3 Index: ${p.h3}</span>
             </div>`
          )
          .addTo(map);
      });

      // Hover cursors
      map.on('mouseenter', 'h3-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'h3-fill', () => { map.getCanvas().style.cursor = ''; });
    });
