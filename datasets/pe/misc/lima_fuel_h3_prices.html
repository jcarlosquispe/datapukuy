            minP + span * 0.75, '#cb181d',
            maxP, '#67000d'
          ],
          'rgba(0,0,0,0)'
        ],
        'fill-opacity': [
          'case',
          ['==', ['typeof', ['get', 'precio']], 'number'],
          0.60,
          0
        ]
      };
    }

    function updateLegend(product) {
      const rng = priceRanges[product];
      document.getElementById('legend-min').textContent = rng.min.toFixed(2);
      document.getElementById('legend-mid').textContent = ((rng.min + rng.max) / 2).toFixed(2);
      document.getElementById('legend-max').textContent = rng.max.toFixed(2);
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-76.98274145504395, -11.972032065664271],
      zoom: 10,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.fitBounds([[-77.1637875362761, -12.23405874119011], [-76.8016953738118, -11.710005390138432]], { padding: 40, duration: 0 });

    function applyFrame() {
      const product = currentProduct();
      const month = currentMonth();
      monthLabel.textContent = month;
      if (!map.getSource('h3-prices')) return;
      map.getSource('h3-prices').setData(hexData(product, month));
      const paint = colorPaint(product);
      map.setPaintProperty('h3-fill', 'fill-color', paint['fill-color']);
      map.setPaintProperty('h3-fill', 'fill-opacity', paint['fill-opacity']);
      updateLegend(product);
    }

    map.on('load', () => {
      const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol');
      const beforeId = firstSymbol ? firstSymbol.id : undefined;
      const product = currentProduct();
      const month = currentMonth();

      map.addSource('h3-prices', { type: 'geojson', data: hexData(product, month) });

      map.addLayer({
        id: 'h3-fill',
        type: 'fill',
        source: 'h3-prices',
        paint: colorPaint(product)
      }, beforeId);

      map.addLayer({
        id: 'h3-line',
        type: 'line',
        source: 'h3-prices',
        paint: {
          'line-color': '#555555',
          'line-width': 0.3,
          'line-opacity': 0.4
        }
      }, beforeId);

      map.on('click', 'h3-fill', (e) => {
        const p = e.features[0].properties;
        const price = Number(p.precio);
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(
            `<div class="popup">
               <strong>${p.product}</strong><br/>
               Month: <b>${p.month}</b><br/>
               Median min. price: <b>${Number.isFinite(price) ? price.toFixed(2) : 'n/a'} S/.</b><br/>
               <span style="color:#777">H3 Index: ${p.h3_index}</span>
             </div>`
          )
          .addTo(map);
      });

      map.on('mouseenter', 'h3-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'h3-fill', () => { map.getCanvas().style.cursor = ''; });

      applyFrame();
    });

    productSelect.addEventListener('change', applyFrame);
    monthSlider.addEventListener('input', applyFrame);

    let timer = null;
    playBtn.addEventListener('click', () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        playBtn.textContent = 'Play';
        return;
      }
      playBtn.textContent = 'Pause';
      timer = setInterval(() => {
        const next = (Number(monthSlider.value) + 1) % months.length;
        monthSlider.value = String(next);
        applyFrame();
      }, 900);
    });
  </script>
</body>
</html>
