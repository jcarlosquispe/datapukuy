name: Fetch OSINERGMIN Data

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dataset
        run: |
          mkdir -p data
          curl -sSL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" \
            "https://www.osinergmin.gob.pe/seccion/centro_documental/hidrocarburos/SCOP/SCOP-DOCS/Reporte-Diario/CL-Registro-precios-DMIN.csv" \
            -o data/CL-Registro-precios-DMIN.csv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osinergmin-csv
          path: data/CL-Registro-precios-DMIN.csv